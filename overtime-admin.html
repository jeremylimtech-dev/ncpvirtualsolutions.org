<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Overtime Requests</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="/ncpicon.ico">
</head>

<body class="admin-page">
<div id="toastContainer" class="toast-container"></div>
<!-- SIDEBAR -->
<aside class="sidebar">

  <div class="sidebar-brand">
    <div class="brand-circle">
      <img src="logo.png">
    </div>
    <span>Admin</span>
  </div>

  <nav class="sidebar-nav">
    <a href="admin-dashboard.html">Dashboard</a>
    <a href="employees.html">Employee List</a>
    <a href="leave-submission-admin.html">Leave Request</a>
    <a class="active" href="overtime-admin.html">Render OT</a>
    <a href="clients.html">Clients</a>
  </nav>

  <button class="logout-btn" onclick="logout()">Logout</button>

</aside>

<!-- MAIN -->
<main class="main-content fade-in">

<header class="top-header">
  <h1>Overtime Request</h1>

  <div class="header-right">
    <div class="profile-box">
      <div class="profile-avatar" id="profileInitials"></div>
      <div class="profile-info">
        <div class="profile-name" id="adminName"></div>
        <div class="profile-email"></div>
      </div>
    </div>
  </div>
</header>

<section class="dashboard-section">

  <!-- TABS -->
  <div class="leave-tabs">
    <button class="tab active" onclick="switchTab(event,'Pending')">Pending</button>
    <button class="tab" onclick="switchTab(event,'Approved')">Approved</button>
    <button class="tab" onclick="switchTab(event,'Rejected')">Rejected</button>
  </div>

  <div id="otLoading" class="table-loading">
  <div class="loader"></div>
  <div>Loading overtime requests...</div>
  </div>

  <table id="otTable" class="leave-table hidden">
  <thead>
    <tr>
      <th>Name</th>
      <th>Date</th>
      <th>Hours</th>
      <th>Description</th>
      <th>Status</th>
      <th></th>
    </tr>
  </thead>
  <tbody id="overtimeContainer"></tbody>
</table>

<div id="overtimePagination" class="pagination"></div>

</section>

</main>

<script>
const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbz4zMRShI6IwL7ehez3Q9VX_ysMQb3Otv__59tgoe5-91zfEN1THvLSJjty_TCN24Wp/exec";

/* =========================
   ADMIN INFO
========================= */

const adminName = localStorage.getItem("adminName") || "Admin";
document.getElementById("adminName").innerText = adminName;
document.getElementById("profileInitials").innerText =
  adminName.split(" ").map(w => w[0]).join("").toUpperCase();

/* =========================
   STATE
========================= */

let allOvertime = [];
let currentTab = "Pending";
let currentPage = 1;
const rowsPerPage = 10;

/* =========================
   LOAD OVERTIME
========================= */

const loadingEl = document.getElementById("otLoading");
const tableEl = document.getElementById("otTable");
const tbody = tableEl.querySelector("tbody");

let hasLoaded = false;

// 🔥 Timeout fallback (5 seconds)
const timeout = setTimeout(() => {
  if (!hasLoaded) {
    loadingEl.classList.add("hidden");
    tableEl.classList.remove("hidden");

    tbody.innerHTML = `
      <tr>
        <td colspan="7" class="empty-state">
          No overtime requests
        </td>
      </tr>
    `;
  }
}, 5000);

fetch(`${SCRIPT_URL}?action=getOvertime`)
  .then(res => res.json())
  .then(data => {

    hasLoaded = true;
    clearTimeout(timeout);

    loadingEl.classList.add("hidden");
    tableEl.classList.remove("hidden");

    if (!data.success || !data.overtime || data.overtime.length === 0) {

      tbody.innerHTML = `
        <tr>
          <td colspan="7" class="empty-state">
            No overtime requests
          </td>
        </tr>
      `;
      return;
    }

    allOvertime = data.overtime || [];
    renderOvertime();
  })
  .catch(() => {
    clearTimeout(timeout);
    loadingEl.classList.add("hidden");
    tableEl.classList.remove("hidden");

    tbody.innerHTML = `
      <tr>
        <td colspan="7" class="empty-state">
          Failed to load overtime data
        </td>
      </tr>
    `;
  });

/* =========================
   TAB SWITCHING
========================= */

function switchTab(e, tab) {
  currentTab = tab;
  currentPage = 1;

  document.querySelectorAll(".tab").forEach(btn =>
    btn.classList.remove("active")
  );

  e.target.classList.add("active");

  renderOvertime();
}

/* =========================
   RENDER OVERTIME
========================= */

function renderOvertime() {

  const container = document.getElementById("overtimeContainer");
  container.innerHTML = "";

  const pending = allOvertime.filter(o =>
    o.status.toLowerCase() === currentTab.toLowerCase()
  );

  if (pending.length === 0) {
    container.innerHTML =
      `<tr><td colspan="6" class="empty-state">
        No ${currentTab.toLowerCase()} overtime requests
      </td></tr>`;
    return;
  }

  pending.forEach(o => {

    const row = document.createElement("tr");

    row.innerHTML = `
      <td><strong>${o.employeeName}</strong></td>
      <td>${formatDate(o.date)}</td>
      <td>${o.hours} hrs</td>
      <td>${o.description}</td>
      <td>
        <span class="status-badge status-${o.status.toLowerCase()}">
          ${o.status}
        </span>
      </td>
      <td>
        ${currentTab === "Pending" ? `
          <button class="approve-btn"
            onclick="updateOvertime(${o.rowIndex}, 'Approved', this)">
            Approve
          </button>
          <button class="reject-btn"
            onclick="updateOvertime(${o.rowIndex}, 'Rejected', this)">
            Reject
          </button>
        ` : ""}
      </td>
    `;

    container.appendChild(row);
  });
}


function showToast(message, type = "success") {

  const container = document.getElementById("toastContainer");

  const toast = document.createElement("div");
  toast.className = `toast ${type}`;
  toast.innerText = message;

  container.appendChild(toast);

  setTimeout(() => {
    toast.style.opacity = "0";
    toast.style.transform = "translateX(20px)";
    setTimeout(() => toast.remove(), 300);
  }, 2500);
}

/* =========================
   PAGINATION
========================= */

function renderPagination(total) {

  const container = document.getElementById("overtimePagination");
  const totalPages = Math.ceil(total / rowsPerPage);

  if (totalPages <= 1) return;

  if (currentPage > 1) {
    container.appendChild(
      createPageBtn("Prev", currentPage - 1)
    );
  }

  for (let i = 1; i <= totalPages; i++) {
    container.appendChild(
      createPageBtn(i, i, i === currentPage)
    );
  }

  if (currentPage < totalPages) {
    container.appendChild(
      createPageBtn("Next", currentPage + 1)
    );
  }
}

function createPageBtn(text, page, active = false) {

  const btn = document.createElement("button");
  btn.innerText = text;

  if (active) btn.classList.add("active-page");

  btn.onclick = () => {
    currentPage = page;
    renderOvertime();
  };

  return btn;
}

/* =========================
   UPDATE STATUS
========================= */
function updateOvertime(rowIndex, status, btn) {

  openConfirm(
    status === "Approved"
      ? "Approve this overtime request?"
      : "Reject this overtime request?",
    () => {

      fetch(SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify({
          action: "updateOvertimeStatus",
          rowIndex,
          status,
          adminName
        })
      })
      .then(res => res.json())
      .then(data => {

        if (!data.success) {
          showToast("Update failed ❌", "error");
          return;
        }

        const row = btn.closest("tr");
        row.style.opacity = "0";
        row.style.transition = "all 0.3s ease";

        setTimeout(() => {
          const req = allOvertime.find(o => o.rowIndex === rowIndex);
          if (req) req.status = status;
          renderOvertime();
          showToast("Overtime updated ✅");
        }, 300);
      });
    }
  );
}

/* =========================
   HELPERS
========================= */
function formatDate(d) {
  if (!d) return "-";
  return new Date(d).toLocaleDateString();
}

function logout() {
  localStorage.clear();
  window.location.href = "index.html";
}

let confirmCallback = null;

function openConfirm(message, callback) {
  document.getElementById("confirmMessage").innerText = message;
  document.getElementById("confirmModal").classList.remove("hidden");

  confirmCallback = callback;
}

function closeConfirm() {
  document.getElementById("confirmModal").classList.add("hidden");
  confirmCallback = null;
}

document.addEventListener("DOMContentLoaded", function() {

  const confirmBtn = document.getElementById("confirmOk");

  if (confirmBtn) {
    confirmBtn.onclick = function() {
      if (confirmCallback) confirmCallback();
      closeConfirm();
    };
  }

});

</script>

<div id="confirmModal" class="confirm-overlay hidden">
  <div class="confirm-box">
    <h3 id="confirmTitle">Confirm Action</h3>
    <p id="confirmMessage">Are you sure?</p>

    <div class="confirm-actions">
      <button class="confirm-cancel" onclick="closeConfirm()">Cancel</button>
      <button id="confirmOk" class="confirm-ok">Confirm</button>
    </div>
  </div>
</div>

</body>
</html>
