<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Employee List</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="/ncpicon.ico">
</head>

<body class="admin-page">

<script>
const adminData = {
  name: "Jeremy Angelo Lim",
  email: "jeremy.spacemeters@gmail.com"
};
</script>

<!-- SIDEBAR -->
<aside class="sidebar">

  <div class="sidebar-brand">
    <div class="brand-circle">
      <img src="logo.png">
    </div>
    <span>Admin</span>
  </div>

  <nav class="sidebar-nav">
    <a href="admin-dashboard.html">Dashboard</a>
    <a class="active" href="#">Employee List</a>
    <a href="leave-submission-admin.html">Leave Request</a>
    <a href="overtime-admin.html">Render OT</a>
    <a href="clients.html">Clients</a>
  </nav>

  <button class="logout-btn" onclick="logoutAdmin()">Logout</button>

</aside>

<!-- MAIN CONTENT -->
<main class="main-content fade-in">

  <!-- HEADER -->
  <header class="top-header">

    <h1>Employee List</h1>

    <div class="header-right">
      <div class="profile-box">
        <div class="profile-avatar" id="profileInitials"></div>
        <div class="profile-info">
          <div class="profile-name" id="adminName"></div>
          <div class="profile-email" id="adminEmail"></div>
        </div>
      </div>
    </div>

  </header>

  <!-- TABLE SECTION -->
  <section class="dashboard-section">

  <div class="table-loading" id="employeeTableLoading">
    <div class="loader"></div>
    <span>Loading employees...</span>
  </div>

  <table id="employeeTable">
      <thead>
        <tr>
          <th>Name</th>
          <th>Employee Type</th>
          <th>Annual Leave</th>
          <th>Sick Leave Balance</th>
          <th>Email</th>
          <th style="text-align:right;">
            <input
              type="text"
              id="employeeSearch"
              placeholder="Search..."
              class="header-search"
            >
          </th>
        </tr>
      </thead>
      <tbody id="employeeTableBody">
      </tbody>
    </table>

  </section>

</main>

<script>
const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbz4zMRShI6IwL7ehez3Q9VX_ysMQb3Otv__59tgoe5-91zfEN1THvLSJjty_TCN24Wp/exec";

/* Profile setup */
document.getElementById("adminName").innerText = adminData.name;
document.getElementById("adminEmail").innerText = adminData.email;

const initials = adminData.name
  .split(" ")
  .map(word => word[0])
  .join("")
  .toUpperCase();

document.getElementById("profileInitials").innerText = initials;

/* Load Employees */
const tableBody = document.getElementById("employeeTableBody");

const loading = document.getElementById("employeeTableLoading");
const table = document.getElementById("employeeTable");
let allEmployees = [];
let currentPage = 1;
const rowsPerPage = 10;
let filteredEmployees = [];

table.classList.add("hidden");
loading.classList.remove("hidden");

fetch(`${SCRIPT_URL}?action=getEmployees`)
  .then(res => res.json())
  .then(data => {

    if (!data.success) throw new Error("Failed to load");

    loading.classList.add("hidden");
    table.classList.remove("hidden");

    if (!data.employees || data.employees.length === 0) {
      tableBody.innerHTML =
        `<tr><td colspan="6">No employees found</td></tr>`;
      return;
    }

    allEmployees = data.employees;
    filteredEmployees = [...allEmployees];
    renderTable();
    renderPagination();
  })
  .catch(err => {
    console.error(err);
    tableBody.innerHTML =
      `<tr><td colspan="6">Error loading employees</td></tr>`;
    loading.classList.add("hidden");
  });

function renderTable() {

  tableBody.innerHTML = "";

  const start = (currentPage - 1) * rowsPerPage;
  const end = start + rowsPerPage;

  const paginatedEmployees =
    filteredEmployees.slice(start, end);

  paginatedEmployees.forEach(emp => {

    const row = document.createElement("tr");

    row.innerHTML = `
      <td>${emp.name}</td>
      <td>${emp.type || "Regular"}</td>
      <td>${emp.annual || "0 hrs"}</td>
      <td>${emp.sick || "0 hrs"}</td>
      <td>${emp.email || "-"}</td>
      <td class="actions">
        <button class="edit-btn"
          onclick="openEmployee('${emp.id}')">
          Edit
        </button>
      </td>
    `;

    tableBody.appendChild(row);
  });
}


document.getElementById("employeeSearch")
  .addEventListener("input", function() {

    const query = this.value.toLowerCase();

    filteredEmployees = allEmployees.filter(emp =>
      emp.name.toLowerCase().includes(query) ||
      (emp.email && emp.email.toLowerCase().includes(query)) ||
      (emp.type && emp.type.toLowerCase().includes(query))
    );

    currentPage = 1; // reset to first page
    renderTable();
    renderPagination();
});


function renderPagination() {

  let container = document.getElementById("pagination");

  if (!container) {
    container = document.createElement("div");
    container.id = "pagination";
    container.className = "pagination";
    table.parentNode.appendChild(container);
  }

  container.innerHTML = "";

  const totalPages =
    Math.ceil(filteredEmployees.length / rowsPerPage);

  if (currentPage > 1) {
    const prev = document.createElement("button");
    prev.innerText = "Prev";
    prev.onclick = () => {
      currentPage--;
      renderTable();
      renderPagination();
    };
    container.appendChild(prev);
  }

  for (let i = 1; i <= totalPages; i++) {
    const btn = document.createElement("button");
    btn.innerText = i;

    if (i === currentPage)
      btn.classList.add("active-page");

    btn.onclick = () => {
      currentPage = i;
      renderTable();
      renderPagination();
    };

    container.appendChild(btn);
  }

  if (currentPage < totalPages) {
    const next = document.createElement("button");
    next.innerText = "Next";
    next.onclick = () => {
      currentPage++;
      renderTable();
      renderPagination();
    };
    container.appendChild(next);
  }
}

function openEmployee(id) {
  openEditModal(id);
}

function logoutAdmin() {
  window.location.href = "index.html";
}

let currentEmployeeId = null;

function openEditModal(id) {

  currentEmployeeId = id;

  const modal = document.getElementById("editModal");
  const loading = document.getElementById("modalLoading");

  modal.classList.add("active");
  loading.classList.add("active");

  fetch(`${SCRIPT_URL}?action=getEmployee&id=${id}`)
    .then(res => res.json())
    .then(data => {

      if (!data.success) {
        loading.classList.remove("active");
        return alert("Failed to load employee");
      }

      const emp = data.employee;

      document.getElementById("editName").value = emp.name || "";
      document.getElementById("editType").value = emp.type || "";
      document.getElementById("editEmail").value = emp.email || "";
      document.getElementById("editAnnual").value = emp.annual || "";
      document.getElementById("editSick").value = emp.sick || "";
      document.getElementById("editContact").value = emp.contact || "";

      const initials = emp.name
        .split(" ")
        .map(w => w[0])
        .join("")
        .toUpperCase();

      document.getElementById("editInitials").innerText = initials;

      loading.classList.remove("active");

      loadClients();
    })
    .catch(() => {
      loading.classList.remove("active");
      alert("Error loading employee");
    });
}

function closeModal() {
  document.getElementById("editModal").classList.remove("active");
}

function saveEmployee() {

  const payload = {
    id: currentEmployeeId,
    name: document.getElementById("editName").value,
    type: document.getElementById("editType").value,
    email: document.getElementById("editEmail").value,
    annual: document.getElementById("editAnnual").value,
    sl: document.getElementById("editSick").value,
    contact: document.getElementById("editContact").value
  };

  fetch(SCRIPT_URL, {
    method: "POST",
    body: JSON.stringify({
      action: "updateEmployee",
      ...payload
    })
  })
  .then(res => res.json())
  .then(data => {
    if (data.success) {
      alert("Employee updated");
      closeModal();
      location.reload();
    } else {
      alert("Update failed");
    }
  });
}

/* Update selected text */
document.addEventListener("change", function(e) {

  if (e.target.closest("#clientsDropdown")) {

    const checked = [
      ...document.querySelectorAll(
        "#clientsDropdown input:checked"
      )
    ].map(cb => cb.value);

    document.getElementById("selectedClientsText").innerText =
      checked.length > 0
        ? checked.join(", ")
        : "Select Clients";
  }

});

/* Close dropdown when clicking outside */
document.addEventListener("click", function(e) {

  const dropdown = document.getElementById("clientsDropdown");
  const selectBox = document.querySelector(".select-box");

  if (!selectBox.contains(e.target) &&
      !dropdown.contains(e.target)) {
    dropdown.style.display = "none";
  }

});

let allClients = [];
let selectedClients = [];
let clientsLoaded = false;   // ✅ cache flag

/* Load clients from sheet */
function loadClients() {

  const cached = localStorage.getItem("clientsCache");

  if (cached) {
    allClients = JSON.parse(cached);
    clientsLoaded = true;
    renderClientOptions(allClients);
    document.getElementById("selectedClientsText").innerText =
      "Select Clients";
    return;
  }

  fetch(`${SCRIPT_URL}?action=getClients`)
    .then(res => res.json())
    .then(data => {

      if (!data.success) return;

      allClients = data.clients;
      clientsLoaded = true;

      // ✅ Store in browser cache
      localStorage.setItem(
        "clientsCache",
        JSON.stringify(allClients)
      );

      renderClientOptions(allClients);

      document.getElementById("selectedClientsText").innerText =
        "Select Clients";

    });
}

/* Render checkboxes */
function renderClientOptions(clients) {

  const container = document.getElementById("clientOptions");
  container.innerHTML = "";

  clients.forEach(client => {

    const label = document.createElement("label");
    label.innerHTML = `
      <input type="checkbox" value="${client}">
      ${client}
    `;

    container.appendChild(label);

  });

}

/* Search */
document.getElementById("clientSearch")
  .addEventListener("input", function() {

    const search = this.value.toLowerCase();

    const filtered = allClients.filter(client =>
      client.toLowerCase().includes(search)
    );

    renderClientOptions(filtered);

});

/* Toggle dropdown */
function toggleClientsDropdown() {

  const dropdown = document.getElementById("clientsDropdown");

  dropdown.style.display =
    dropdown.style.display === "flex"
      ? "none"
      : "flex";

}

/* Track selected */
document.addEventListener("change", function(e) {

  if (e.target.closest("#clientOptions")) {

    const checked = [
      ...document.querySelectorAll(
        "#clientOptions input:checked"
      )
    ].map(cb => cb.value);

    selectedClients = checked;

    document.getElementById("selectedClientsText")
      .innerText =
        checked.length > 0
          ? checked.join(", ")
          : "Select Clients";

  }

});

loadClients();

</script>


<!-- EDIT EMPLOYEE MODAL -->
<div class="modal-overlay" id="editModal">

  <div class="modal-box fade-in">

    <h2>Edit Employee</h2>

    <div class="modal-loading" id="modalLoading">
      <div class="loader"></div>
      <span>Loading employee...</span>
    </div>

    <div class="modal-content">

      <div class="modal-left">
        <div class="avatar-circle">
          <span id="editInitials">JL</span>
        </div>
      </div>

      <div class="modal-right">

        <div class="form-grid">

          <div class="form-group">
            <label>Name</label>
            <input type="text" id="editName">
          </div>

          <div class="form-group">
            <label>Employee Type</label>
            <input type="text" id="editType">
          </div>

          <div class="form-group">
            <label>Email</label>
            <input type="text" id="editEmail">
          </div>

          <div class="form-group">
            <label>Annual Balance</label>
            <input type="text" id="editAnnual">
          </div>

          <div class="form-group">
            <label>Contact Number</label>
            <input type="text" id="editContact">
          </div>

          <div class="form-group">
            <label>Sick Balance</label>
            <input type="text" id="editSick">
          </div>

          <div class="form-group full-width">
            <label>Clients</label>

            <div class="multi-select">

              <div class="select-box" onclick="toggleClientsDropdown()">
                <span id="selectedClientsText">Loading...</span>
                <span>▾</span>
              </div>

              <div class="checkbox-dropdown" id="clientsDropdown">

                <input type="text"
                      id="clientSearch"
                      placeholder="Search clients..."
                      class="client-search">

                <div id="clientOptions"></div>

              </div>

            </div>
          </div>

        </div>

        <div class="modal-actions">
          <button class="primary-btn" onclick="saveEmployee()">Save Changes</button>
          <button class="secondary-btn" onclick="closeModal()">Cancel</button>
        </div>

      </div>

    </div>

  </div>
</div>

</body>
</html>
