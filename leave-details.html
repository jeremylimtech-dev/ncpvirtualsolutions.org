<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Leave Details</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="/ncpicon.ico" type="image/x-icon">
  <link rel="shortcut icon" href="/ncpicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
</head>
<body class="admin-page">

<!-- SIDEBAR -->
<aside class="sidebar">

  <div class="sidebar-brand">
    <div class="brand-circle">
      <img src="logo.png">
    </div>
    <span>Employee</span>
  </div>

  <nav class="sidebar-nav">
    <a href="employee-dashboard.html">Dashboard</a>
    <a class="active" href="#">File a Leave</a>
    <a href="overtime-submission.html">Render OT</a>
    <a href="leave-history.html">Leave History</a>
  </nav>

  <button class="logout-btn">Logout</button>

</aside>

<!-- MAIN -->
<main class="main-content fade-in">

  <!-- HEADER -->
  <header class="top-header">
    <h1>File a Leave</h1>

    <div class="profile-box">
      <div class="profile-avatar" id="profileInitials">JL</div>
      <div class="profile-info">
        <div class="profile-name">Jeremy Angelo Lim</div>
        <div class="profile-email">jeremy.spacemeters@gmail.com</div>
      </div>
    </div>
  </header>

  <!-- FORM GRID -->
  <div class="leave-form-grid">

    <!-- LEFT COLUMN -->
    <div class="form-column">

      <div class="form-group">
        <label>Name</label>
        <input type="text" id="employeeName" readonly>
      </div>

      <div class="form-group">
        <label>Leave Type</label>
        <select id="leaveTypeSelect">
          <option value="Sick">Sick Leave</option>
          <option value="Annual">Annual Leave</option>
          <option value="Unpaid">Unpaid Leave</option>
        </select>
      </div>

      <div class="form-group">
        <label>Remaining Balance</label>
        <input type="text" id="balance" readonly>
        <div class="balance-preview" id="balancePreview">
          Remaining after request: —
        </div>

        <div class="warning-box hidden" id="sickWarning">
          Sick leave over 16 hours requires medical certificate.
        </div>
      </div>

    </div>

    <!-- CENTER COLUMN -->
    <div class="form-column">

      <div class="form-group">
        <label>Select Date Range</label>
        <input type="text" id="dateRange" placeholder="Select date range">
      </div>

    </div>

    <!-- RIGHT COLUMN -->
    <div class="form-column">

      <label>Hours per day</label>
      <div class="hours-toggle">
        <button type="button" class="hour-btn active" onclick="setHours(8,this)">
          Full Day – 8 Hours
        </button>
        <button type="button" class="hour-btn" onclick="setHours(4,this)">
          Half Day – 4 Hours
        </button>
      </div>

      <div class="form-group">
        <label>Reason</label>
        <textarea id="reason"></textarea>
      </div>

    </div>

  </div>

  <div class="submit-wrapper">
    <button class="primary-btn" onclick="submitLeave()">Submit</button>
  </div>

</main>

<script src="auth.js"></script>

<script>

let hoursPerDay = 8;
let availableBalanceHours = 0;
let selectedStart = null;
let selectedEnd = null;
let submitting = false;

document.addEventListener("DOMContentLoaded", async () => {

  // 🔐 Require login
  if (!requireAuth()) return;

  // 👤 Load profile header
  initEmployeeProfile();

  const employee = getEmployee();
  document.getElementById("employeeName").value = employee.name;

  // Initialize Flatpickr
  flatpickr("#dateRange", {
    mode: "range",
    dateFormat: "Y-m-d",
    minDate: "today",
    onChange: function(selectedDates) {
      if (selectedDates.length === 2) {
        selectedStart = selectedDates[0];
        selectedEnd = selectedDates[1];
        calculateTotal();
      }
    }
  });

  document
    .getElementById("leaveTypeSelect")
    .addEventListener("change", loadBalance);

  await loadBalance();
});


/* =====================
   LOAD BALANCE (SECURE)
===================== */
async function loadBalance() {

  const type = document.getElementById("leaveTypeSelect").value;
  const balanceInput = document.getElementById("balance");

  if (type === "Unpaid") {
    availableBalanceHours = Infinity;
    balanceInput.value = "Unpaid Leave: Unlimited";
    calculateTotal();
    return;
  }

  balanceInput.value = "Loading…";

  const res = await securePost("getEmployeeBalanceSecure", {
    leaveType: type
  });

  if (!res || !res.success) {
    balanceInput.value = "Unable to load balance";
    return;
  }

  availableBalanceHours = res.balanceHours;
  balanceInput.value = `${type} Balance: ${availableBalanceHours} hours`;

  calculateTotal();
}


/* =====================
   HOURS TOGGLE
===================== */
function setHours(hours, btn) {

  hoursPerDay = hours;

  document
    .querySelectorAll(".hour-btn")
    .forEach(b => b.classList.remove("active"));

  btn.classList.add("active");

  calculateTotal();
}


/* =====================
   CALCULATE TOTAL
===================== */
function calculateTotal() {

  const preview = document.getElementById("balancePreview");
  const warning = document.getElementById("sickWarning");

  preview.classList.remove("valid", "invalid");

  if (!selectedStart || !selectedEnd) {
    preview.innerText = "Remaining after request: —";
    disableSubmit(true);
    return;
  }

  let days = 0;
  for (let d = new Date(selectedStart); d <= selectedEnd; d.setDate(d.getDate() + 1)) {
    if (d.getDay() !== 0 && d.getDay() !== 6) days++;
  }

  const total = days * hoursPerDay;

  if (availableBalanceHours === Infinity) {
    preview.innerText = "Unpaid leave – no balance limit";
    preview.classList.add("valid");
    disableSubmit(false);
  } else {

    const remaining = availableBalanceHours - total;
    preview.innerText = "Remaining after request: " + remaining + " hours";

    if (remaining < 0) {
      preview.classList.add("invalid");
      disableSubmit(true);
    } else {
      preview.classList.add("valid");
      disableSubmit(false);
    }
  }

  const type = document.getElementById("leaveTypeSelect").value;
  if (type === "Sick" && total > 16) {
    warning.classList.remove("hidden");
  } else {
    warning.classList.add("hidden");
  }
}


/* =====================
   SUBMIT (SECURE)
===================== */
async function submitLeave() {

  if (submitting) return;
  submitting = true;

  const submitBtn = document.querySelector(".primary-btn");
  const type = document.getElementById("leaveTypeSelect").value;
  const reason = document.getElementById("reason").value.trim();

  if (!selectedStart || !selectedEnd || !reason) {
    showToast("Please complete all fields.");
    submitting = false;
    return;
  }

  let days = 0;
  for (let d = new Date(selectedStart); d <= selectedEnd; d.setDate(d.getDate() + 1)) {
    if (d.getDay() !== 0 && d.getDay() !== 6) days++;
  }

  const total = days * hoursPerDay;

  if (type !== "Unpaid" && total > availableBalanceHours) {
    showToast("Insufficient balance.");
    submitting = false;
    return;
  }

  submitBtn.classList.add("loading");
  submitBtn.disabled = true;

  const res = await securePost("submitLeaveSecure", {
    leaveType: type,
    startDate: selectedStart.toISOString().split("T")[0],
    endDate: selectedEnd.toISOString().split("T")[0],
    hoursPerDay,
    totalHours: total,
    reason
  });

  if (!res || !res.success) {
    showToast("Submission failed.");
    submitBtn.classList.remove("loading");
    submitBtn.disabled = false;
    submitting = false;
    return;
  }

  submitBtn.classList.remove("loading");
  submitBtn.innerText = "Submitted ✓";
  submitBtn.style.background = "#16a34a";

  setTimeout(() => {
    window.location.href = "employee-dashboard.html";
  }, 800);
}


/* =====================
   UTILITIES
===================== */
function disableSubmit(state) {
  const btn = document.querySelector(".primary-btn");
  btn.disabled = state;
  btn.classList.toggle("disabled-state", state);
}

function showToast(message, type = "error") {

  const container = document.getElementById("leaveToastContainer");
  if (!container) return;

  const toast = document.createElement("div");
  toast.className = `leave-toast ${type}`;
  toast.innerText = message;

  container.appendChild(toast);

  setTimeout(() => {
    toast.classList.add("fade-out");
    setTimeout(() => toast.remove(), 300);
  }, 3000);
}

</script>

<div class="leave-toast-container" id="leaveToastContainer"></div>
</body>
</html>
