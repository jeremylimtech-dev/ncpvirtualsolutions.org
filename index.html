<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>

<link rel="stylesheet" href="login.css">
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body>

<div class="main-container">

  <div class="login-card">

    <div class="login-brand">
      <img src="logo.png">
      <span>NCP Bookkeeping</span>
    </div>

    <!-- TOGGLE -->
    <div class="role-toggle">
      <button id="employeeTab" class="active" onclick="switchRole('employee')">Employee</button>
      <button id="adminTab" onclick="switchRole('admin')">Admin</button>
    </div>

    <!-- EMPLOYEE SECTION -->
    <div id="employeeSection">

      <h2>Employee Login</h2>

      <div id="googleBtn" class="google-wrapper"></div>

    </div>

    <!-- ADMIN SECTION -->
    <div id="adminSection" style="display:none;">

      <h2>Admin Login</h2>

      <div class="input-group">
        <input type="text" id="adminUser" placeholder="Username">
      </div>

      <div class="input-group">
        <input type="password" id="adminPass" placeholder="Password">
      </div>

      <button class="login-btn" onclick="loginAdmin()">Login</button>

    </div>

  </div>

</div>

<script>

const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbz4zMRShI6IwL7ehez3Q9VX_ysMQb3Otv__59tgoe5-91zfEN1THvLSJjty_TCN24Wp/exec";

/* =========================
   SWITCH ROLE
========================= */
function switchRole(role) {

  const emp = document.getElementById("employeeSection");
  const adm = document.getElementById("adminSection");

  const empTab = document.getElementById("employeeTab");
  const admTab = document.getElementById("adminTab");

  if (role === "employee") {
    emp.style.display = "block";
    adm.style.display = "none";
    empTab.classList.add("active");
    admTab.classList.remove("active");
  } else {
    emp.style.display = "none";
    adm.style.display = "block";
    empTab.classList.remove("active");
    admTab.classList.add("active");
  }
}

/* =========================
   GOOGLE INIT
========================= */
window.onload = function () {

  google.accounts.id.initialize({
    client_id: "900054162881-dvjja2fq6chqmib71avgsbkrr0es0kt1.apps.googleusercontent.com",
    callback: handleCredentialResponse
  });

  google.accounts.id.renderButton(
    document.getElementById("googleBtn"),
    {
      theme: "filled_blue",
      size: "large",
      shape: "pill",
      width: 280
    }
  );
};

function handleCredentialResponse(response) {
  verifyEmployee(response.credential);
}

function verifyEmployee(idToken) {

  fetch(SCRIPT_URL, {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      action: "employeeAuth",
      idToken: idToken
    })
  })
  .then(async res => {

    // Show HTTP error if not 200
    if (!res.ok) {
      const text = await res.text();
      throw new Error("HTTP " + res.status + " → " + text);
    }

    return res.json();
  })
  .then(data => {

    if (!data.success) {
      console.error("Backend response:", data);
      alert("Access denied. Check console for details.");
      return;
    }

    localStorage.setItem("employeeToken", idToken);
    localStorage.setItem("employeeData", JSON.stringify(data.employee));

    window.location.href = "employee-dashboard.html";
  })
  .catch(err => {
    console.error("LOGIN ERROR:", err);
    alert("Login failed. Open DevTools → Console.");
  });
}

/* =========================
   ADMIN LOGIN
========================= */

function loginAdmin() {

  const username = document.getElementById("adminUser").value;
  const password = document.getElementById("adminPass").value;

  const body = new URLSearchParams({
    action: "verifyAdmin",
    username,
    password
  });

  fetch(SCRIPT_URL, {
    method: "POST",
    body
  })
  .then(res => res.json())
  .then(data => {

    if (!data.success) {
      alert("Invalid credentials.");
      return;
    }

    localStorage.setItem("adminToken", "true");
    window.location.href = "admin-dashboard.html";
  });
}

</script>

</body>
</html>
